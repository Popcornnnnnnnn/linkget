name: Tests and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: macos-14
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m unittest discover -s tests -q
        env:
          PYTHONPATH: src
      - run: python -m build
      - name: Verify isolated installed wheel
        shell: bash
        run: |
          python -m venv /tmp/linkget-wheel
          /tmp/linkget-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/linkget-wheel/bin/linkget --version
          /tmp/linkget-wheel/bin/linkget help
          /tmp/linkget-wheel/bin/python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -q
      - name: Check AppleScript syntax in the isolated runner
        if: runner.os == 'macOS'
        run: osacompile -o /tmp/linkget-import.scpt src/linkget/import.applescript
